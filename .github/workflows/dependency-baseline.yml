name: Dependency advisory evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Collect advisory baseline (not a security approval)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated scanner
        run: python -m pip install -r requirements-audit.txt
      - name: Resolve and collect real advisory evidence
        run: |
          if python -m scripts.audit_dependencies; then
            echo 'No known findings in this resolved set.'
          else
            audit_status=$?
            if [ "$audit_status" -ne 1 ]; then exit "$audit_status"; fi
            echo 'Known vulnerabilities recorded; remediation and release security gates remain open.'
          fi
      - name: Verify owned process cleanup
        run: python -m unittest tests.test_dependency_audit_processes
      - name: Publish advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-advisory-evidence
          path: |
            output/dependency-audit/baseline-linux.json
            output/dependency-audit/metadata-linux.json
            output/dependency-audit/scanner-linux.log
            output/dependency-audit/failure-linux.json
          if-no-files-found: warn
          retention-days: 7
