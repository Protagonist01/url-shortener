name: Dependency advisory evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Collect advisory baseline (not a security approval)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated scanner
        run: python -m pip install -r requirements-audit.txt
      - name: Resolve and collect real advisory evidence
        run: |
          for scope in runtime test operations; do
            if python -m scripts.audit_dependencies --scope "$scope"; then
              echo "No known findings in the $scope resolved set."
            else
              audit_status=$?
              if [ "$audit_status" -ne 1 ]; then exit "$audit_status"; fi
              echo "Known findings in $scope recorded; release security gates remain open."
            fi
          done
      - name: Verify owned process cleanup
        run: python -m unittest tests.test_dependency_audit_processes tests.test_dependency_scopes
      - name: Enforce targeted JWT/framework/parser/test repairs and install boundaries
        run: python -m scripts.verify_dependency_remediation
      - name: Publish advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-advisory-evidence
          path: |
            output/dependency-audit/baseline-linux.json
            output/dependency-audit/metadata-linux.json
            output/dependency-audit/scanner-linux.log
            output/dependency-audit/failure-linux.json
            output/dependency-audit/baseline-test-linux.json
            output/dependency-audit/metadata-test-linux.json
            output/dependency-audit/scanner-test-linux.log
            output/dependency-audit/failure-test-linux.json
            output/dependency-audit/baseline-operations-linux.json
            output/dependency-audit/metadata-operations-linux.json
            output/dependency-audit/scanner-operations-linux.log
            output/dependency-audit/failure-operations-linux.json
          if-no-files-found: warn
          retention-days: 7
