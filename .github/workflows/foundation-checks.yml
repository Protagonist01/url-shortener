name: Foundation correctness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Isolated foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out this revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned direct requirements
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Reproduce historical pytest boundary in an isolated fixture
        run: |
          python -m venv output/legacy-pytest
          output/legacy-pytest/bin/python -m pip install -r requirements-legacy-pytest.txt
          output/legacy-pytest/bin/python -m scripts.verify_pytest_boundary --expect-vulnerable
      - name: Verify fixed pytest boundary and ordinary temporary roots
        run: python -m scripts.verify_pytest_boundary
      - name: Verify the actual production image and entrypoints
        run: python -m scripts.verify_runtime_dependencies
      - name: Verify separately installed monitoring command
        run: |
          python -m venv output/operations
          output/operations/bin/python -m pip install -r requirements-ops.txt
          output/operations/bin/python -m pip check
          output/operations/bin/python -m celery --broker=redis://127.0.0.1:26379/1 flower --help
          output/operations/bin/python -c "from importlib.util import find_spec; assert all(find_spec(n) is None for n in ('pytest', 'pytest_asyncio', 'psutil', 'pip_audit'))"
      - name: Prepare isolated historical JWT fixture
        run: |
          python -m venv output/legacy-jwt
          output/legacy-jwt/bin/python -m pip install -r requirements-legacy-jwt.txt
          echo "LEGACY_JWT_PYTHON=$PWD/output/legacy-jwt/bin/python" >> "$GITHUB_ENV"
      - name: Verify JWT contracts and historical interoperability
        run: python -m unittest tests.test_security_tokens -v
      - name: Verify framework and parser library boundaries
        run: python -m unittest tests.test_framework_boundaries -v
      - name: Verify configuration boundaries
        run: python -m scripts.verify_configuration --docker
      - name: Verify task registration
        run: python -m pytest tests/test_worker_registration.py -c pytest.ini -q --junitxml=output/worker-registration/unit.xml
      - name: Start owned disposable services
        run: python -m scripts.verify_worker_registration up
      - name: Verify migrations and real worker delivery
        run: python -m scripts.verify_worker_registration verify
      - name: Verify real authentication and printed URL compatibility
        run: python -m scripts.verify_authentication run
      - name: Remove only owned fixtures
        if: always()
        run: python -m scripts.verify_worker_registration down
      - name: Publish synthetic verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-verification
          path: |
            output/worker-registration/
            output/authentication-verification/
            output/test-dependency/
            output/framework-dependency/evidence.json
            output/framework-dependency/mixed-workload-raw.json
          if-no-files-found: warn
          retention-days: 7
