# Render Blueprint — defines all services for the URL shortener.
# Deploy via: connect this repo to Render, or use `render blueprint deploy`.
#
# After deploying, ONE manual step is needed:

#   1. Go to: dashboard.render.com → New + → Redis → create (free plan, 30MB)
#   2. Copy the Internal Connection String (looks like: rediss://red-xxxx:6379)
#   3. Go to your web service's Environment tab and add these 3 env vars:
#        REDIS_URL             = rediss://red-xxxx:6379
#        CELERY_BROKER_URL     = rediss://red-xxxx:6379
#        CELERY_RESULT_BACKEND = rediss://red-xxxx:6379
#
# That's it — everything else is automatic. The rate limiter, cache, and
# click tracking all share the same Redis instance (key prefixes are unique
# so there are no collisions).
#
# Click tracking uses FastAPI BackgroundTasks (CLICK_TRACKING_BACKEND=background_tasks)
# so no Celery worker is needed — all features work on the free tier.

databases:
  - name: shortener-db
    databaseName: shortener
    ipAllowList: []
    plan: free

services:
  - type: web
    name: url-shortener-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shortener-db
          property: connectionString
      - key: CLICK_TRACKING_BACKEND
        value: background_tasks
      - key: SHORT_URL_BASE
        value: https://url-shortener-api.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CACHE_TTL_SECONDS
        value: "3600"