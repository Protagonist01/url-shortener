# Render Blueprint — defines all services for the URL shortener.
# Deploy via: connect this repo to Render, or use `render blueprint deploy`.
#
# Services created:
#   1. web     — FastAPI API (uvicorn, 2 workers)
#   2. postgres — Managed PostgreSQL 16
#   3. redis   — Managed Redis
#
# Click tracking uses FastAPI BackgroundTasks (CLICK_TRACKING_BACKEND=background_tasks)
# instead of a Celery worker. This means:
#   - Clicks are written to the DB by the API process after the 302 is sent.
#   - No paid Celery worker needed — everything runs on the free tier.
#   - Less robust than Celery (lost on crash/restart) but fine for a portfolio.
#
# To upgrade to Celery (more robust, retries on failure): set
# CLICK_TRACKING_BACKEND=celery and add a worker service (see BUILD_BOOK Entry 12).

databases:
  - name: shortener-db
    databaseName: shortener
    ipAllowList: []
    plan: free

services:
  - type: keyvalue
    name: shortener-redis
    ipAllowList: []
    plan: free

  - type: web
    name: snipurl
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shortener-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: shortener-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: shortener-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: shortener-redis
          property: connectionString
      - key: CLICK_TRACKING_BACKEND
        value: background_tasks
      - key: SHORT_URL_BASE
        value: https://snipurl.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CACHE_TTL_SECONDS
        value: "3600"
